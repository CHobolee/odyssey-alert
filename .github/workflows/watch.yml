name: odyssey-alert
# GitHub 예약 실행은 몇 시간씩 밀리기도 해서, 잡 하나가 약 5시간 40분 동안
# 60초 간격으로 계속 확인한다. 끝날 때 스스로 다음 실행을 켜서(릴레이) 끊기지 않는다.
# 매시 예약(cron)은 릴레이가 끊겼을 때를 위한 보험. concurrency 로 항상 1개만 돈다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "알림 테스트만 보내기"
        type: boolean
        default: false
      blocked:
        description: "(자동) 연속으로 CGV에 막힌 서버 수"
        type: string
        default: "0"
permissions:
  contents: write
  actions: write
concurrency:
  group: odyssey-alert-${{ inputs.test && 'test' || 'watch' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 알림 테스트
        if: ${{ inputs.test }}
        run: python3 odyssey_alert.py --test
      - name: curl_cffi 설치 (크롬 TLS 지문)
        if: ${{ !inputs.test }}
        run: pip install -q -U curl_cffi
      - name: 약 5시간 40분 동안 60초 간격으로 확인
        id: watch
        if: ${{ !inputs.test }}
        env:
          BLOCKED_STREAK: ${{ inputs.blocked || '0' }}
        run: |
          set +e
          python3 odyssey_alert.py --loop 60 --minutes 335
          code=$?
          if [ $code -eq 3 ]; then echo "blocked=$(( ${BLOCKED_STREAK:-0} + 1 ))" >> $GITHUB_OUTPUT; else echo "blocked=0" >> $GITHUB_OUTPUT; fi
          # 나쁜 서버만 30번 연속이면(약 30분) 한 번만 알림
          if [ $code -eq 3 ] && [ "${BLOCKED_STREAK:-0}" = "30" ] && [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Odyssey alert problem" -H "Priority: high" -d "GitHub 서버 30대가 연속으로 CGV에 막혔어요. 확인이 필요해요." "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
          [ $code -eq 0 ] || [ $code -eq 3 ]
      - name: 알림 보낸 날짜 저장
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "odyssey-alert"; git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
      - name: 다음 실행 켜기 (릴레이)
        if: ${{ always() && !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b="${{ steps.watch.outputs.blocked || '0' }}"
          # 나쁜 서버라 교대하는 경우: 바로 다음 서버로 (계속 나쁘면 조금씩 쉼)
          [ "$b" -gt 10 ] && sleep 30
          gh workflow run watch.yml --ref main -R ${{ github.repository }} -f blocked="$b"
