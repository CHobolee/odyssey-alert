name: odyssey-alert
# GitHub 예약 실행은 몇 시간씩 밀리기도 해서, 잡 하나가 약 5시간 40분 동안
# 60초 간격으로 계속 확인한다. 끝날 때 스스로 다음 실행을 켜서(릴레이) 끊기지 않는다.
# 매시 예약(cron)은 릴레이가 끊겼을 때를 위한 보험. concurrency 로 항상 1개만 돈다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "알림 테스트만 보내기"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: odyssey-alert-${{ inputs.test && 'test' || 'watch' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 알림 테스트
        if: ${{ inputs.test }}
        run: python3 odyssey_alert.py --test
      - name: curl_cffi 설치 (크롬 TLS 지문)
        if: ${{ !inputs.test }}
        run: pip install -q curl_cffi
      - name: 약 5시간 40분 동안 60초 간격으로 확인
        if: ${{ !inputs.test }}
        run: python3 odyssey_alert.py --loop 60 --minutes 335
      - name: 알림 보낸 날짜 저장
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "odyssey-alert"; git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
      - name: 다음 실행 켜기 (릴레이)
        if: ${{ always() && !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main -R ${{ github.repository }}
