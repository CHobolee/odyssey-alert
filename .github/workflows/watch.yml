name: odyssey-alert
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub가 종종 늦게 실행함)
  workflow_dispatch:
    inputs:
      test:
        description: "알림 테스트만 보내기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: odyssey-alert
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 알림 테스트
        if: ${{ inputs.test }}
        run: python3 odyssey_alert.py --test
      - name: 4분 동안 60초 간격으로 확인
        if: ${{ !inputs.test }}
        run: |
          for i in 1 2 3 4; do python3 odyssey_alert.py --once || true; sleep 60; done
      - name: 알림 보낸 날짜 저장
        if: ${{ !inputs.test }}
        run: |
          git config user.name "odyssey-alert"; git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
